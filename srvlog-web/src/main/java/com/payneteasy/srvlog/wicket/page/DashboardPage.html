<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<body>
<wicket:extend>
    <div wicket:id="feedbackPanel"></div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                <span class="font-semibold text-slate-700">Logs statistics</span>
            </div>
            <div wicket:id="button-group-holder" class="flex gap-1 flex-wrap">
                <a wicket:id="THIS_WEEK" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">this week</a>
                <a wicket:id="LAST_WEEK" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">last week</a>
                <a wicket:id="THIS_MONTH" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">this month</a>
                <a wicket:id="LAST_MONTH" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">last month</a>
            </div>
        </div>
        <div class="p-4">
            <div class="flex flex-col lg:flex-row gap-6">
                <div class="lg:w-1/3">
                    <div class="px-4 py-2 bg-slate-50 border-b border-slate-200 flex items-center gap-2 mb-2">
                        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                        <span class="font-medium text-slate-700 text-sm">Number of logs by severity</span>
                    </div>
                    <div wicket:id="list-severity-holder" class="border border-slate-200 rounded-lg overflow-hidden">
                        <div wicket:id="list-severity" class="border-b border-slate-200 last:border-b-0">
                            <a href="" wicket:id="link" class="block px-4 py-3 hover:bg-slate-50 transition-colors flex items-center justify-between">
                                <span wicket:id="name"></span>
                                <span wicket:id="count" class="px-2 py-0.5 rounded text-sm font-semibold bg-slate-200 text-slate-800"></span>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="lg:flex-1">
                    <div class="px-4 py-2 bg-slate-50 border-b border-slate-200 flex items-center gap-2 mb-2">
                        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                        <span class="font-medium text-slate-700 text-sm">Number of logs by date</span>
                    </div>
                    <div class="border border-slate-200 rounded-lg overflow-hidden relative">
                        <div id="container" class="w-full" style="height: 400px;"></div>
                        <div id="noDataContainer" class="hidden absolute inset-0 flex items-center justify-center bg-slate-50/90 text-slate-500 font-medium">No data for this period</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        function drawChart(map){
            var jsonObj = JSON && JSON.parse(map) || $.parseJSON(map);
            if($.isEmptyObject(jsonObj)){
               $("#noDataContainer").removeClass("hidden");
               $("#container").children().remove();
            }else{
                $("#noDataContainer").addClass("hidden");
                doChart();
            }

            function doChart() {
                Highcharts.setOptions({
                    global: {
                        useUTC: false
                    }
                });

                var chart = new Highcharts.Chart({
                    chart: {
                        renderTo: 'container',
                        animation: false
                    },
                    scrollbar: { enabled: false },
                    rangeSelector: { enabled: false },
                    navigator: { enabled: false},
                    credits: {enabled: false},
                    title: { text: null },

                    tooltip: {
                        formatter: function () {
                            var s = '<div style="color: #eae8e8; display: block; border-bottom: 1px solid  #9d9d9d; text-align: center; margin-bottom: 5px;">' + Highcharts.dateFormat('%Y-%m-%d', this.x) + '</div>';
                                s += '<span style="font-weight: bold;color:'+this.series.color+';">Count of logs = ' + this.y+'</span><br/>';
                            return s;
                        },
                        useHTML: true,
                        borderColor : '#999',
                        borderWidth : 1,
                        borderRadius: 4,
                        backgroundColor: "rgba(08,80,80,80)",
                        shadow: false
                    },
                    legend: {
                        enabled: false
                    },
                    plotOptions: {
                        line: {
                            lineWidth: 0.5,
                            animation: false
                        }
                    },
                    xAxis: {
                        type: 'datetime',
                        dateTimeLabelFormats: {
                            second: '%Y-%m-%d',
                            minute: '%Y-%m-%d',
                            hour: '%Y-%m-%d',
                            day: '%Y-%m-%d',
                            week: '%Y-%m-%d',
                            month: '%Y-%m-%d',
                            year: '%Y-%m-%d'
                        },
                        gridLineColor: "#eae3e3",
                        gridLineWidth: 0.5,
                        tickInterval: 24 * 3600 * 1000,
                        labels:{
                            overflow: "justify"
                        }
                    },
                    yAxis: {
                        title: {
                            text: null
                        },
                        gridLineWidth: 0,
                        showFirstLabel: false
                    },
                    series: [
                        {
                            name: "count",
                            data: jsonObj,
                            color: "#f59e0b",
                            type: "line"
                        }
                    ]
                });
            }

        }
     </script>

</wicket:extend>
</body>
</html>
