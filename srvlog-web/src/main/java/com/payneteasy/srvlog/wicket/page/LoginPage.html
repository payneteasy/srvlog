<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<head>
    <title>Login page</title>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center py-12 px-4">

<div class="w-full max-w-sm">
    <form wicket:id="loginForm" class="bg-white rounded-xl shadow-lg border border-slate-200 p-8" action="">
        <h2 class="text-xl font-semibold text-slate-800 mb-6 text-center">Please log in</h2>

        <div wicket:id="reason" class="mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm border border-red-200"></div>

        <input wicket:id="j_username" id="j_username" name="j_username" type="text" placeholder="Username" class="w-full px-4 py-3 mb-4 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"/>

        <input wicket:id="j_password" id="j_password" name="j_password" type="password" placeholder="Password" class="w-full px-4 py-3 mb-6 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"/>

        <input wicket:id="loginButton" type="submit" class="w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors cursor-pointer"/>
    </form>
</div>

</body>
</html>
