<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<body>
<wicket:extend>
    <div class="flex flex-col lg:flex-row gap-6">
        <aside class="lg:w-64 flex-shrink-0">
            <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
                <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Detailed logs</h3>
                <ul class="space-y-0">
                    <li wicket:id="firewall-alert-container">
                        <a href="#" wicket:id="firewall-alert" class="sidebar-link block px-3 py-2 rounded-md text-slate-700 hover:bg-slate-200 transition-colors">Firewall alert data</a>
                    </li>
                    <li wicket:id="firewall-drop-container">
                        <a href="#" wicket:id="firewall-drop" class="sidebar-link block px-3 py-2 rounded-md text-slate-700 hover:bg-slate-200 transition-colors">Firewall drop data</a>
                    </li>
                    <li wicket:id="ossec-alert-container">
                        <a href="#" wicket:id="ossec-alert" class="sidebar-link block px-3 py-2 rounded-md text-slate-700 hover:bg-slate-200 transition-colors">Ossec alert data</a>
                    </li>
                </ul>
            </div>
        </aside>

        <div class="flex-1 min-w-0">
            <wicket:child/>
        </div>
    </div>
</wicket:extend>
</body>
</html>
