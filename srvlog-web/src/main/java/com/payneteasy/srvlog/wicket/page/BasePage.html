<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<wicket:head>
    <title>Srvlog log collector</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</wicket:head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
<div class="min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-slate-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <!-- Top bar -->
            <div class="flex items-center justify-between h-14">
                <a href="#" class="text-xl font-semibold tracking-tight text-white hover:text-slate-200 transition-colors">SRVLOG</a>

                <!-- Nav links (tablet+: horizontal, mobile: collapsed via #nav-mobile) -->
                <div id="nav-links" class="hidden md:flex items-center gap-1 flex-wrap">
                    <div wicket:id="dashboard-container"><a href="#" wicket:id="dashboard" class="nav-link">Dashboard</a></div>
                    <div wicket:id="logs-container"><a href="#" wicket:id="logs" class="nav-link">Logs</a></div>
                    <div wicket:id="online-logs-container"><a href="#" wicket:id="online-logs" class="nav-link">Online Logs</a></div>
                    <div wicket:id="terminal-container"><a href="#" wicket:id="terminal" class="nav-link">Terminal</a></div>
                    <div wicket:id="detailed-logs-container"><a href="#" wicket:id="detailed-logs" class="nav-link">Detailed logs</a></div>
                    <div wicket:id="add-hosts-container"><a href="#" wicket:id="add-hosts" class="nav-link">Add hosts</a></div>
                    <a href="j_spring_security_logout" class="ml-4 px-4 py-2 rounded-md bg-slate-600 hover:bg-slate-500 text-white text-sm font-medium transition-colors">Logout</a>
                </div>

                <!-- Hamburger (mobile only, hidden on tablet+) -->
                <button class="nav-hamburger-btn p-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-700 transition-colors"
                        onclick="toggleMobileNav()" aria-label="Toggle navigation">
                    <svg id="nav-icon-open" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
                    </svg>
                    <svg id="nav-icon-close" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         style="display:none">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Mobile menu — same links cloned via JS into #nav-mobile -->
            <div id="nav-mobile" class="nav-mobile-menu hidden md:hidden border-t border-slate-700 py-2"></div>

        </div>
    </nav>

    <wicket:enclosure child="warnings-link">
        <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 mt-4">
            <div class="warning-banner p-4 bg-amber-50 border border-amber-200 rounded-lg flex flex-col gap-3">
                <div class="flex-1 min-w-0">
                    <h4 class="font-semibold text-amber-800">Warnings!</h4>
                    <p class="text-amber-700 text-sm mt-1">There are logs with unresolved hosts. Please add required hosts and press "Process unresolved logs".</p>
                </div>
                <div class="warning-actions flex flex-col gap-2">
                    <a href="#" wicket:id="warnings-link" class="inline-flex justify-center items-center px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium transition-colors">Process unresolved logs</a>
                    <a href="" wicket:id="show-unprocessed-hosts-link" class="inline-flex justify-center items-center px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium transition-colors">Show unprocessed hosts</a>
                </div>
            </div>
        </div>
    </wicket:enclosure>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <wicket:child/>
    </main>
</div>

<script type="text/javascript">
    // Clone desktop nav links into mobile menu
    (function () {
        var src    = document.getElementById('nav-links');
        var target = document.getElementById('nav-mobile');
        if (!src || !target) return;

        // Copy each child link/container
        Array.prototype.forEach.call(src.children, function (child) {
            var clone = child.cloneNode(true);
            // Make links full-width for mobile
            var link = clone.tagName === 'A' ? clone : clone.querySelector('a');
            if (link) link.classList.add('block', 'w-full');
            target.appendChild(clone);
        });
    })();

    function toggleMobileNav() {
        var menu      = document.getElementById('nav-mobile');
        var iconOpen  = document.getElementById('nav-icon-open');
        var iconClose = document.getElementById('nav-icon-close');
        var isOpen    = !menu.classList.contains('hidden');

        menu.classList.toggle('hidden');
        if (iconOpen)  iconOpen.style.display  = isOpen ? '' : 'none';
        if (iconClose) iconClose.style.display = isOpen ? 'none' : '';
    }
</script>
</body>
</html>
