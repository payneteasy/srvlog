<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<body>
<wicket:extend>
    <div wicket:id="feedbackPanel"></div>
    <div class="max-w-2xl">
        <form wicket:id="form" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <fieldset class="space-y-4">
                <label class="block text-sm font-medium text-slate-700">Hosts:</label>
                <textarea wicket:id="hosts" placeholder="Use format host1,ip1;host2,ip2 or host1;host2 ..." class="w-full h-40 px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-y font-mono text-sm"></textarea>
                <div>
                    <button wicket:id="button" type="submit" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors">Add hosts</button>
                </div>
            </fieldset>
        </form>
    </div>
</wicket:extend>
</body>
</html>
