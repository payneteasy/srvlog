<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<body>
<wicket:extend>
    <div class="overflow-x-auto rounded-lg border border-slate-200">
        <table class="main-table w-full text-sm">
            <thead>
            <tr>
                <th class="px-4 py-3 text-left font-semibold text-slate-700">Class</th>
                <th class="px-4 py-3 text-left font-semibold text-slate-700">Count</th>
            </tr>
            </thead>
            <tbody>
            <tr wicket:id="list-view" class="border-t border-slate-200 hover:bg-slate-50 transition-colors">
                <td wicket:id="alert-class" class="px-4 py-2">Alert</td>
                <td wicket:id="alert-count" class="px-4 py-2">10</td>
            </tr>
            <tr wicket:id="no-data" class="border-t border-slate-200"><td colspan="2" class="px-4 py-8 text-center text-slate-500">No data found</td></tr>
            </tbody>
        </table>
    </div>
</wicket:extend>
</body>
</html>
