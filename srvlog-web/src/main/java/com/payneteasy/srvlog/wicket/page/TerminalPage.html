<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">

<wicket:head>
    <style>
        #terminal {
            display: block;
            position: relative;
            height: 80%;
            width: 98%;
            margin: 0;
            padding: 0;
            margin-left: 20px;
        }
    </style>
</wicket:head>

<wicket:extend>
    <body>
        <div id="page" class="mb-4">
            <div class="flex flex-wrap items-center gap-4">
                <h4 class="text-sm font-medium text-slate-500">Hosts:</h4>
                <select wicket:id="choices-host" id="selected-hosts" class="px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></select>
                <h4 class="text-sm font-medium text-slate-500">Programs:</h4>
                <select wicket:id="choices-program" id="selected-programs" class="px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></select>
            </div>
        </div>

        <div id='terminal'></div>

    </body>
</wicket:extend>

</html>
