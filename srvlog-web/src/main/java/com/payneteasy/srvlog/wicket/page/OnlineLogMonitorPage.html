<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<body>
<wicket:extend>

    <div id="page" class="space-y-4">
        <div class="flex flex-wrap items-center gap-4">
            <h4 class="text-sm font-medium text-slate-500">Hosts:</h4>
            <form wicket:id="hostChoice-form">
                <select wicket:id="choices-host" class="px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></select>
            </form>
            <h4 class="text-sm font-medium text-slate-500">Latest logs:</h4>
            <wicket:container wicket:id="latestLog-groupButton-panel"></wicket:container>
            <h4 class="text-sm font-medium text-slate-500">Time duration update:</h4>
            <wicket:container wicket:id="timeDuration-groupButton-panel"></wicket:container>
        </div>

        <div wicket:id="holder-search-log-data" class="overflow-x-auto rounded-lg border border-slate-200">
            <table class="main-table w-full text-sm">
                <colgroup>
                    <col width="120px"/>
                    <col width="100px"/>
                    <col width="100px"/>
                </colgroup>
                <thead>
                <tr>
                    <th class="px-4 py-3 text-left font-semibold text-slate-700">Date</th>
                    <th class="px-4 py-3 text-left font-semibold text-slate-700">Facility</th>
                    <th class="px-4 py-3 text-left font-semibold text-slate-700">Severity</th>
                    <th class="px-4 py-3 text-left font-semibold text-slate-700">Host</th>
                    <th class="px-4 py-3 text-left font-semibold text-slate-700">Program</th>
                    <th class="px-4 py-3 text-left font-semibold text-slate-700">Message</th>
                </tr>
                </thead>
                <tbody>
                <tr wicket:id="search-log-data" class="border-t border-slate-200 hover:bg-slate-50 transition-colors">
                    <td wicket:id="log-date" id="log-date" class="log-date px-4 py-2">Date</td>
                    <td wicket:id="log-facility" class="px-4 py-2">Facility</td>
                    <td wicket:id="log-severity" class="px-4 py-2">Severity</td>
                    <td wicket:id="log-host" class="px-4 py-2">Host</td>
                    <td wicket:id="log-program" class="px-4 py-2">Program</td>
                    <td class="px-4 py-2"><span wicket:id="log-message" class="log-message"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="text/javascript">
        var lastDateText = $("tbody tr .log-date").first().text(), hasMore = false;

        function animateLastTableRow() {
            $("tbody tr").each(function () {
                var dateText = $(this).find(".log-date").text();
                if (new Date(lastDateText) < new Date(dateText)) {
                    hasMore = true;
                    var $row = $(this);
                    $row.addClass("log-row-highlight");
                    setTimeout(function () {
                        $row.removeClass("log-row-highlight");
                    }, 1000);
                }
            });

            if (hasMore) {
                lastDateText = $("tbody tr .log-date").first().text();
                hasMore = false;
            }
        }
    </script>

</wicket:extend>
</body>
</html>
