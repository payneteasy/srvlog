<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org/dtds.data/wicket-xhtml1.4-strict.dtd">
<head>
    <title></title>
</head>
<body>
<wicket:panel>
    <!-- Date Range Type Selector -->
    <div>
        <select wicket:id="date-range-type" 
                class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg 
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none
                       bg-white hover:border-slate-400 transition-colors">
            <option id="TODAY">TODAY</option>
        </select>
    </div>

    <!-- Custom Date/Time Range Fields -->
    <div wicket:id="holder-exactly-dateRange" class="mt-3 space-y-3">
        <!-- Date Range Fields (for EXACTLY_DATE) -->
        <wicket:enclosure child="dateFrom-field">
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1.5">From Date</label>
                <div class="relative">
                    <input wicket:id="dateFrom-field" autocomplete="off"
                           class="w-full pl-3 pr-10 py-2 text-sm border border-slate-300 rounded-lg 
                                  focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none
                                  bg-white hover:border-slate-400 transition-colors"/>
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                        <svg class="w-4 h-4 text-slate-500" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </wicket:enclosure>

        <wicket:enclosure child="dateTo-field">
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1.5">To Date</label>
                <div class="relative">
                    <input wicket:id="dateTo-field" autocomplete="off"
                           class="w-full pl-3 pr-10 py-2 text-sm border border-slate-300 rounded-lg 
                                  focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none
                                  bg-white hover:border-slate-400 transition-colors"/>
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                        <svg class="w-4 h-4 text-slate-500" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </wicket:enclosure>

        <!-- DateTime Range Fields (for EXACTLY_TIME) -->
        <wicket:enclosure child="timeFrom-field">
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1.5">From Date & Time</label>
                <div class="relative">
                    <input wicket:id="timeFrom-field" autocomplete="off"
                           class="w-full pl-3 pr-10 py-2 text-sm border border-slate-300 rounded-lg 
                                  focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none
                                  bg-white hover:border-slate-400 transition-colors"/>
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                        <svg class="w-4 h-4 text-slate-500" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </wicket:enclosure>

        <wicket:enclosure child="timeTo-field">
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1.5">To Date & Time</label>
                <div class="relative">
                    <input wicket:id="timeTo-field" autocomplete="off"
                           class="w-full pl-3 pr-10 py-2 text-sm border border-slate-300 rounded-lg 
                                  focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none
                                  bg-white hover:border-slate-400 transition-colors"/>
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                        <svg class="w-4 h-4 text-slate-500" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </wicket:enclosure>
    </div>
</wicket:panel>
</body>
</html>
