<html xmlns="wicket">
<body>
<wicket:panel>
    <div class="flex flex-wrap items-center justify-end gap-6">
        <div class="flex items-center gap-2 text-sm text-slate-600">
            <span wicket:id="paging-from-row" class="px-2 py-0.5 rounded bg-slate-200 font-medium"></span>
            <span>-</span>
            <span wicket:id="paging-to-row" class="px-2 py-0.5 rounded bg-slate-200 font-medium"></span>
        </div>
        <ul class="flex gap-3 list-none m-0 p-0">
            <li>
                <a href="#" wicket:id="paging-first" class="paging-a px-4 py-2 rounded-full border border-slate-300 bg-white text-blue-600 hover:bg-slate-50 transition-colors text-sm font-medium">First</a>
            </li>
            <li>
                <a href="#" wicket:id="paging-previous" class="paging-a px-4 py-2 rounded-full border border-slate-300 bg-white text-blue-600 hover:bg-slate-50 transition-colors text-sm font-medium">Previous</a>
            </li>
            <li>
                <a href="#" wicket:id="paging-next" class="paging-a px-4 py-2 rounded-full border border-slate-300 bg-white text-blue-600 hover:bg-slate-50 transition-colors text-sm font-medium">Next</a>
            </li>
        </ul>
    </div>
</wicket:panel>
</body>
</html>
